<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animals Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root { --teal: #00fff0; --display-font: "Londrina Solid", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; max-width: 820px; min-height: 100vh; margin: 0 auto; padding: 18px; color: #fff; background: #071218 url("https://lh3.googleusercontent.com/d/1lgrvPms5_GyTkt3YaSzbxBp7ZxzwMrm0") center / cover fixed no-repeat; }
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: rgba(0, 8, 14, .58); }
    .card { margin-bottom: 14px; padding: 0; background: transparent; border: 0; border-radius: 0; box-shadow: none; }
    h1, h2, #questionNumber, #questionText, #questionScore, .option, #score, .meta-label, .meta-value, .qbox-label, button { font-family: var(--display-font); }
    h1 { margin: 0 0 8px; font-size: clamp(42px, 10vw, 64px); font-weight: 900; letter-spacing: .5px; text-shadow: 0 0 6px var(--teal); }
    h2 { font-size: clamp(36px, 8vw, 54px); font-weight: 900; }
    .join-screen { max-width: 480px; margin: 0 auto; padding: 18px; text-align: center; background: rgba(5, 20, 27, .48); border: 1px solid rgba(0, 255, 240, .20); border-radius: 14px; box-shadow: 0 6px 10px rgba(0, 0, 0, .28); }
    #qrcode { display: inline-block; padding: 10px; margin: 10px 0; background: #fff; border: 1px solid #eee; border-radius: 12px; }
    #qrStatus, .small { color: #b9d5d6; font-size: 14px; }
    #qrStatus { margin-top: 6px; }
    #quiz-container, #results { display: none; }
    .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; max-width: 620px; margin: 0 auto 12px; }
    .meta-item { display: flex; align-items: baseline; gap: 8px; }
    .meta-label { color: #9be9e4; font-size: 14px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 1px 3px #000; }
    .meta-value { color: #fff; font-size: clamp(18px, 3.2vw, 24px); font-weight: 900; letter-spacing: .5px; text-shadow: 0 0 3px rgba(0,255,240,.5); }
    #questionBox { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: stretch; gap: 10px; max-width: 620px; margin: 0 auto 12px; }
    #questionNumber, #questionScore { display: flex; align-items: center; justify-content: center; aspect-ratio: 1 / 1; min-width: 64px; white-space: nowrap; color: var(--teal); background: rgba(0, 30, 36, .72); border: 2px solid var(--teal); border-radius: 12px; font-size: clamp(22px, 4vw, 30px); font-weight: 900; text-shadow: 0 0 4px rgba(0,255,240,.6); box-shadow: 0 0 4px rgba(0,255,240,.5), inset 0 0 10px rgba(0,255,240,.12); }
    #questionText { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 64px; padding: 10px 14px; color: #dffffd; background: rgba(0, 30, 36, .72); border: 2px solid var(--teal); border-radius: 12px; font-size: clamp(21px, 4.5vw, 32px); font-weight: 900; line-height: 1.05; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.6); box-shadow: 0 0 4px rgba(0,255,240,.5), inset 0 0 10px rgba(0,255,240,.12); }
    .qbox-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .qbox-label { color: #9be9e4; font-size: 12px; font-weight: 900; letter-spacing: .5px; text-transform: uppercase; text-shadow: 0 1px 3px #000; }
    ul { padding: 0; margin: 0; list-style: none; }
    #options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 620px; margin: 0 auto; }
    .option { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 8px; cursor: pointer; user-select: none; color: var(--teal); background: rgba(0, 30, 36, .72); border: 2px solid var(--teal); border-radius: 13px; font-size: clamp(68px, 18vw, 132px); font-weight: 900; line-height: 1; text-shadow: 0 0 4px rgba(0,255,240,.5); box-shadow: 0 0 4px rgba(0,255,240,.5), inset 0 0 10px rgba(0,255,240,.12); transition: transform .12s, background .15s, color .15s, border-color .15s, box-shadow .15s; }
    .option:hover { transform: scale(1.03); background: rgba(0, 65, 70, .8); }
    .option.disabled { cursor: default; }
    .option.correct { color: #fff; background: #0b8f47; border-color: #47ff91; text-shadow: 0 1px 3px rgba(0,0,0,.5); box-shadow: 0 0 8px rgba(32,255,117,.5), inset 0 0 10px rgba(255,255,255,.1); }
    .option.incorrect { color: #fff; background: #a31529; border-color: #ff596c; text-shadow: 0 1px 3px rgba(0,0,0,.5); box-shadow: 0 0 8px rgba(255,32,61,.5), inset 0 0 10px rgba(255,255,255,.1); }
    .actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button { padding: 9px 14px; cursor: pointer; color: #fff; border: 0; border-radius: 9px; font-size: 16px; font-weight: 900; letter-spacing: .5px; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
    .primary { background: #00a99d; box-shadow: 0 0 12px rgba(0,255,240,.5); }
    .primary:disabled { cursor: not-allowed; background: #426361; box-shadow: none; }
    .secondary { background: rgba(0, 30, 36, .85); border: 1px solid rgba(0,255,240,.5); }
    .big-btn { padding: 11px 22px; font-size: 20px; border-radius: 11px; }
    .field { display: grid; justify-content: center; gap: 6px; margin-top: 10px; }
    input[type="text"] { width: min(360px, 90vw); padding: 10px; color: #fff; background: #071c22; border: 1px solid #62c9c5; border-radius: 10px; font-size: 16px; text-align: center; }
    .row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .pill { padding: 3px 8px; color: #003b3b; background: #71fff7; border-radius: 999px; font-size: 12px; }
    .hint { max-width: 680px; margin: 8px auto 0; text-align: center; }
    #leaderboardBox { max-width: 620px; margin: 12px auto 0; padding: 12px 14px; background: rgba(5, 20, 27, .62); border: 1px solid rgba(0, 255, 240, .22); border-radius: 12px; box-shadow: 0 6px 24px rgba(0, 0, 0, .28); }
    #leaderboardTitle { margin-bottom: 5px; color: var(--teal); font-family: var(--display-font); font-size: clamp(21px, 4vw, 28px); font-weight: 900; letter-spacing: .5px; text-shadow: 0 0 4px rgba(0,255,240,.6); }
    #leaderboard { color: #e4ffff; font-size: 14px; line-height: 1.3; }
    .lb-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 27px; padding: 3px 2px; border-bottom: 1px solid rgba(255,255,255,.15); font-family: var(--display-font); font-size: clamp(15px, 2.6vw, 19px); letter-spacing: .3px; }
    .lb-row:last-child { border-bottom: 0; }
    #resultFX { min-height: 70px; margin-top: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
    .waiting-message { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 58px; padding: 12px 18px; color: #dffffd; font-family: var(--display-font); font-size: clamp(19px, 4vw, 28px); font-weight: 900; text-align: center; animation: waitingPulse 1.5s ease-in-out infinite; }
    .waiting-spinner { display: inline-block; width: 20px; height: 20px; flex: 0 0 20px; border: 3px solid rgba(0,255,240,.25); border-top-color: var(--teal); border-radius: 50%; animation: waitingSpin .8s linear infinite; }
    @keyframes waitingSpin { to { transform: rotate(360deg); } }
    @keyframes waitingPulse { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
    .victory-banner { display: inline-block; padding: 14px 36px; background: rgba(0, 40, 45, .75); border: 2px solid var(--teal); border-radius: 999px; box-shadow: 0 0 10px rgba(0,255,240,.6), inset 0 0 14px rgba(0,255,240,.15); animation: victoryPop .5s ease-out, victoryPulse 1.6s ease-in-out .5s infinite; }
    .victory-banner span { color: var(--teal); font-family: var(--display-font); font-size: clamp(28px, 6vw, 44px); font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 6px rgba(0,255,240,.7); }
    @keyframes victoryPop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes victoryPulse { 0%, 100% { box-shadow: 0 0 10px rgba(0,255,240,.6), inset 0 0 14px rgba(0,255,240,.15); } 50% { box-shadow: 0 0 22px rgba(0,255,240,.9), inset 0 0 22px rgba(0,255,240,.3); } }
    .victory-gif, .defeat-gif { display: block; width: min(320px, 80vw); border: 2px solid var(--teal); border-radius: 16px; box-shadow: 0 0 14px rgba(0,255,240,.55); animation: victoryPop .5s ease-out .15s both; }
    .defeat-gif { border-color: #ff596c; box-shadow: 0 0 14px rgba(255,89,108,.55); }
    #finalLeaderboardBox { max-width: 480px; margin: 18px auto 0; padding: 12px 14px; background: rgba(5, 20, 27, .62); border: 1px solid rgba(0, 255, 240, .22); border-radius: 12px; box-shadow: 0 6px 24px rgba(0, 0, 0, .28); text-align: left; }
    #finalLeaderboardTitle { margin-bottom: 5px; color: var(--teal); font-family: var(--display-font); font-size: clamp(20px, 3.6vw, 26px); font-weight: 900; letter-spacing: .5px; text-shadow: 0 0 4px rgba(0,255,240,.6); text-align: center; }
    #finalLeaderboard { color: #e4ffff; font-size: 14px; line-height: 1.3; }
    #results { text-align: center; }
    #score { margin: 8px 0; color: #fff; font-size: 56px; font-weight: 900; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
    @media (max-width: 560px) {
      body { padding: 8px; }
      .meta { margin-bottom: 8px; }
      .meta-label { font-size: 12px; }
      .meta-value { font-size: 18px; }
      #options { gap: 7px; }
      .option { padding: 5px; border-radius: 10px; font-size: clamp(60px, 17vw, 105px); }
      #questionBox { gap: 6px; margin-bottom: 8px; }
      #questionNumber, #questionScore { min-width: 48px; border-radius: 9px; font-size: 17px; }
      #questionText { min-height: 48px; padding: 7px 8px; border-radius: 9px; font-size: 19px; }
      .qbox-label { font-size: 10px; }
      #leaderboardBox { margin-top: 8px; padding: 8px 10px; border-radius: 10px; }
      #leaderboardTitle { margin-bottom: 2px; font-size: 23px; }
      .lb-row { min-height: 23px; padding: 1px 0; font-size: 16px; }
      .lb-row .pill { padding: 2px 6px; font-size: 11px; }
      .actions { gap: 6px; margin-top: 8px; }
      button { padding: 7px 11px; font-size: 14px; }
      .big-btn { padding: 8px 17px; font-size: 18px; }
    }
  </style>
</head>
<body>
  <div id="join-screen" class="card join-screen">
    <h1>Animals Quiz</h1>
    <div id="qrcode"></div>
    <div id="qrStatus"></div>
    <form id="joinForm">
      <div class="field">
        <label class="small" for="playerName">Your name</label>
        <input id="playerName" type="text" placeholder="e.g. Pat" autocomplete="nickname" style="text-align:left" />
        <label class="small" for="gameInput">Game code (format 12 34 56)</label>
        <input id="gameInput" type="text" placeholder="12 34 56" inputmode="numeric" />
        <div class="small">Current game: <span id="gameLabel" class="pill">None</span></div>
      </div>
      <div class="small hint">All players in the room must type the same game code to compete.</div>
      <div class="row" style="margin-top:14px;"><button type="submit" class="primary">Start Quiz</button></div>
    </form>
  </div>
  <div id="quiz-container" class="card">
    <div id="quiz">
      <div class="meta"><div class="meta-item"><span class="meta-label">Player</span><span id="whoami" class="meta-value"></span></div><div class="meta-item"><span class="meta-label">Game</span><span id="gamePill" class="meta-value"></span></div></div>
      <div id="questionBox"><div class="qbox-col"><div class="qbox-label">Question</div><div id="questionNumber">1/20</div></div><div id="questionText">Question</div><div class="qbox-col"><div class="qbox-label">Score</div><div id="questionScore"><span id="scoreLive">0</span></div></div></div>
      <ul id="options"></ul>
      <div id="leaderboardBox"><div id="leaderboardTitle">Leaderboard</div><div id="leaderboard" class="small">Connecting...</div></div>
      <div class="actions" style="justify-content:flex-end;"><button class="secondary" onclick="restart()">Restart</button><button id="nextBtn" class="primary big-btn" onclick="nextQuestion()" disabled>Next</button></div>
    </div>
    <div id="results"><h2>Finished!</h2><div id="score"></div><div id="scoreSub" class="small"></div><div id="resultFX"></div><div id="finalLeaderboardBox" style="display:none;"><div id="finalLeaderboardTitle">Final Scores</div><div id="finalLeaderboard"></div></div><div class="actions"><button class="primary" onclick="restart()">Play again</button></div></div>
  </div>
  <script>
    const quizData = [
      { q: "What do you call a baby cat?", correct: 1, pts: 1 },
      { q: "Which animal is known as the King of the Jungle?", correct: 2, pts: 1 },
      { q: "Which animal has a very long neck?", correct: 1, pts: 1 },
      { q: "Which bird cannot fly?", correct: 2, pts: 1 },
      { q: "What is the fastest land animal?", correct: 2, pts: 1 },
      { q: "What animal builds dams in rivers?", correct: 1, pts: 2 },
      { q: "What is the largest land animal on Earth?", correct: 2, pts: 2 },
      { q: "Which reptile can change its skin color?", correct: 2, pts: 2 },
      { q: "What is the only mammal capable of true flight?", correct: 1, pts: 2 },
      { q: "What is a marsupial's defining feature?", correct: 1, pts: 2 },
      { q: "Which marine animal has three hearts?", correct: 1, pts: 3 },
      { q: "Which animal has the most complex eyes in nature?", correct: 1, pts: 3 },
      { q: "What is the venomous mammal that lays eggs?", correct: 2, pts: 3 },
      { q: "Which insect can lift 50 times its own body weight?", correct: 1, pts: 3 },
      { q: "Which bird has the longest migration route?", correct: 1, pts: 3 },
      { q: "What animal has fingerprints similar to humans?", correct: 2, pts: 4 },
      { q: "Which animal has the longest lifespan recorded?", correct: 0, pts: 4 },
      { q: "Which animal can grow back a whole lost leg as an adult?", correct: 3, pts: 4 },
      { q: "Which animal can go the longest without drinking water?", correct: 1, pts: 4 },
      { q: "Which animal can change from male to female when it grows up?", correct: 0, pts: 4 }
    ];
    const SOCKET_SERVER_URL = "https://quiz-leaderboard-server-1.onrender.com";
    const cuteNames = ["Pink Flamingo", "Tiny Panda", "Happy Koala", "Baby Tiger", "Sunny Bunny", "Mimi Cat", "Blue Dolphin", "Star Penguin", "Lucky Zebra", "Peach Fox", "Moon Kitty", "Jelly Otter"];
    let gameCode = "", idx = 0, score = 0, answered = false, myName = "", latestLeaderboard = [], awaitingFinalResults = false, finalResultsShown = false, waitingStartedAt = 0, finalCheckTimer = null, defaultGameCode = "", defaultPlayerName = "";
    function roomIdFromGameCode(code) { return String(code || "").replace(/\D/g, ""); }
    function makeGameCode() { const s = String(Math.floor(Math.random() * 1000000)).padStart(6, "0"); return s.slice(0, 2) + " " + s.slice(2, 4) + " " + s.slice(4, 6); }
    function normalizeGameCode(code) { const d = String(code || "").replace(/\D/g, ""); return d.length === 6 ? d.slice(0, 2) + " " + d.slice(2, 4) + " " + d.slice(4, 6) : ""; }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
    function updateGameUI() { document.getElementById("gameLabel").textContent = gameCode || "None"; document.getElementById("gamePill").textContent = gameCode || ""; const input = document.getElementById("gameInput"); if (input && gameCode && input.value === defaultGameCode) input.value = gameCode; }
    function renderQR() { const holder = document.getElementById("qrcode"); holder.innerHTML = ""; if (!window.QRCode) return; new QRCode(holder, { text: window.location.origin + window.location.pathname, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M }); document.getElementById("qrStatus").textContent = window.location.origin + window.location.pathname; }
    function saveName(name) { try { window.name = JSON.stringify({ quizPlayerName: name }); } catch {} }
    function getSavedName() { try { return JSON.parse(window.name || "{}").quizPlayerName || ""; } catch { return ""; } }
    const socket = io(SOCKET_SERVER_URL, { transports: ["websocket", "polling"] });
    socket.on("connect", () => { if (!latestLeaderboard.length) document.getElementById("leaderboard").textContent = "Connected"; socket.emit("joinGame", { gameId: roomIdFromGameCode(gameCode), playerName: myName }); });
    socket.on("connect_error", () => { if (!latestLeaderboard.length) document.getElementById("leaderboard").textContent = "Cannot reach server"; });
    socket.on("leaderboardUpdate", rows => { mergeLeaderboard(rows); renderLeaderboard(latestLeaderboard); if (awaitingFinalResults) scheduleFinalCheck(); });
    function mergeLeaderboard(rows) { if (!Array.isArray(rows)) return; const byName = new Map(latestLeaderboard.map(r => [String(r.name), r])); rows.forEach(r => { if (!r || !r.name) return; const key = String(r.name); const previous = byName.get(key) || {}; byName.set(key, { ...previous, ...r, score: Number.isFinite(Number(r.score)) ? Number(r.score) : (previous.score || 0) }); }); latestLeaderboard = [...byName.values()]; }
    function renderLeaderboard(rows) { const el = document.getElementById("leaderboard"); if (!el) return; if (!rows || !rows.length) { el.textContent = "No players yet."; return; } const sorted = [...rows].sort((a, b) => (b.score || 0) - (a.score || 0)); el.innerHTML = sorted.map((r, i) => `<div class="lb-row"><div>${i + 1}. ${escapeHtml(r.name)}${r.name === myName ? " (you)" : ""}</div><div><span class="pill">${r.score || 0}</span></div></div>`).join(""); }
    function startQuiz() { myName = (document.getElementById("playerName").value || "").trim(); saveName(myName); const enteredCode = normalizeGameCode(document.getElementById("gameInput").value); if (!enteredCode) { alert("Type game code like 12 34 56"); return; } gameCode = enteredCode; updateGameUI(); socket.emit("joinGame", { gameId: roomIdFromGameCode(gameCode), playerName: myName }); document.getElementById("join-screen").style.display = "none"; document.getElementById("quiz-container").style.display = "block"; document.getElementById("whoami").textContent = myName; document.getElementById("gamePill").textContent = gameCode; document.getElementById("scoreLive").textContent = "0"; idx = 0; score = 0; answered = false; latestLeaderboard = []; awaitingFinalResults = false; finalResultsShown = false; clearTimeout(finalCheckTimer); document.getElementById("finalLeaderboardBox").style.display = "none"; socket.emit("scoreUpdate", { gameId: roomIdFromGameCode(gameCode), playerName: myName, score, qIndex: idx }); loadQuestion(); }
    function loadQuestion() { answered = false; document.getElementById("questionNumber").textContent = `${idx + 1}/${quizData.length}`; document.getElementById("questionText").textContent = quizData[idx].q; const options = document.getElementById("options"); options.innerHTML = ""; ["A", "B", "C", "D"].forEach((letter, i) => { const tile = document.createElement("li"); tile.className = "option"; tile.textContent = letter; tile.addEventListener("click", () => choose(i, tile)); options.appendChild(tile); }); document.getElementById("nextBtn").disabled = true; document.getElementById("nextBtn").textContent = idx === quizData.length - 1 ? "Finish" : "Next"; socket.emit("scoreUpdate", { gameId: roomIdFromGameCode(gameCode), playerName: myName, score, qIndex: idx }); }
    function choose(optIndex, tile) { if (answered) return; answered = true; document.querySelectorAll("#options .option").forEach(item => item.classList.add("disabled")); if (optIndex === quizData[idx].correct) { tile.classList.add("correct"); score += quizData[idx].pts; document.getElementById("scoreLive").textContent = score; } else tile.classList.add("incorrect"); socket.emit("scoreUpdate", { gameId: roomIdFromGameCode(gameCode), playerName: myName, score, qIndex: idx }); document.getElementById("nextBtn").disabled = false; }
    function nextQuestion() { if (!answered) return; idx++; if (idx >= quizData.length) showResults(); else loadQuestion(); }
    const MAX_POINTS = quizData.reduce((sum, item) => sum + item.pts, 0);
    function showResults() { document.getElementById("quiz").style.display = "none"; document.getElementById("results").style.display = "block"; document.getElementById("score").textContent = `${score} pts`; document.getElementById("scoreSub").textContent = `out of ${MAX_POINTS} points possible`; document.getElementById("resultFX").innerHTML = '<div class="waiting-message"><span class="waiting-spinner"></span><span>Waiting for the other players to finish...</span></div>'; document.getElementById("finalLeaderboardBox").style.display = "none"; socket.emit("scoreUpdate", { gameId: roomIdFromGameCode(gameCode), playerName: myName, score, qIndex: quizData.length }); mergeLeaderboard([{ name: myName, score, qIndex: quizData.length }]); renderLeaderboard(latestLeaderboard); awaitingFinalResults = true; finalResultsShown = false; waitingStartedAt = Date.now(); scheduleFinalCheck(); }
    function allKnownPlayersFinished() { return latestLeaderboard.length > 0 && latestLeaderboard.every(r => Number(r.qIndex) >= quizData.length); }
    function scheduleFinalCheck() { if (!awaitingFinalResults || finalResultsShown) return; clearTimeout(finalCheckTimer); finalCheckTimer = setTimeout(checkWinners, 500); }
    function checkWinners() { if (!awaitingFinalResults || finalResultsShown) return; const waitingDuration = Date.now() - waitingStartedAt; if (!allKnownPlayersFinished() && waitingDuration < 12000) { scheduleFinalCheck(); return; } revealFinalResults(); }
    function revealFinalResults() { if (finalResultsShown) return; finalResultsShown = true; awaitingFinalResults = false; clearTimeout(finalCheckTimer); const fx = document.getElementById("resultFX"); const topScore = latestLeaderboard.reduce((max, player) => Math.max(max, Number(player.score) || 0), score); if (score >= topScore) fx.innerHTML = '<div class="victory-banner"><span>YOU WIN</span></div><img class="victory-gif" src="https://lh3.googleusercontent.com/d/1gMrM28v8BJY6WEg-r4mdaCeXl77-2IaP" alt="Victory" />'; else fx.innerHTML = '<div style="color:#ff8490;font-weight:800;">Not #1 this time</div><img class="defeat-gif" src="https://lh3.googleusercontent.com/d/1K_pihRXa7WcA-1xiUnPL9o-8VIYrBPzE" alt="Defeat" />'; document.getElementById("finalLeaderboardBox").style.display = "block"; renderFinalLeaderboard(); }
    function renderFinalLeaderboard() { const el = document.getElementById("finalLeaderboard"); if (!el) return; const rows = latestLeaderboard.length ? latestLeaderboard : [{ name: myName, score }]; const sorted = [...rows].sort((a, b) => (b.score || 0) - (a.score || 0)); el.innerHTML = sorted.map((r, i) => `<div class="lb-row"><div>${i + 1}. ${escapeHtml(r.name)}${r.name === myName ? " (you)" : ""}</div><div><span class="pill">${r.score || 0} pts</span></div></div>`).join(""); }
    function restart() { clearTimeout(finalCheckTimer); awaitingFinalResults = false; finalResultsShown = false; waitingStartedAt = 0; latestLeaderboard = []; document.getElementById("resultFX").innerHTML = ""; document.getElementById("finalLeaderboard").innerHTML = ""; document.getElementById("finalLeaderboardBox").style.display = "none"; document.getElementById("quiz-container").style.display = "none"; document.getElementById("join-screen").style.display = "block"; document.getElementById("quiz").style.display = "block"; document.getElementById("results").style.display = "none"; idx = 0; score = 0; answered = false; myName = ""; gameCode = ""; document.getElementById("playerName").value = defaultPlayerName; document.getElementById("gameInput").value = defaultGameCode; updateGameUI(); renderQR(); }
    document.getElementById("playerName").addEventListener("focus", e => { if (e.target.value === defaultPlayerName) e.target.value = ""; });
    document.getElementById("gameInput").addEventListener("focus", e => { if (e.target.value === defaultGameCode) e.target.value = ""; });
    document.addEventListener("input", e => { if (e.target?.id !== "gameInput") return; const digits = String(e.target.value || "").replace(/\D/g, "").slice(0, 6); e.target.value = digits.length <= 2 ? digits : digits.length <= 4 ? digits.slice(0, 2) + " " + digits.slice(2) : digits.slice(0, 2) + " " + digits.slice(2, 4) + " " + digits.slice(4, 6); });
    document.getElementById("joinForm").addEventListener("submit", e => { e.preventDefault(); setTimeout(startQuiz, 0); });
    window.addEventListener("load", () => { renderQR(); defaultGameCode = makeGameCode(); gameCode = defaultGameCode; document.getElementById("gameInput").value = defaultGameCode; updateGameUI(); defaultPlayerName = getSavedName() || cuteNames[Math.floor(Math.random() * cuteNames.length)]; document.getElementById("playerName").value = defaultPlayerName; });
  </script>
