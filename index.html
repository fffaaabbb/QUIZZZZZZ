<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animals Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <style>
    :root { --teal: #00fff0; --display-font: "Londrina Solid", Arial, sans-serif; }
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      max-width: 820px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px;
      color: #fff;
      background: #071218 url("https://lh3.googleusercontent.com/d/1lgrvPms5_GyTkt3YaSzbxBp7ZxzwMrm0") center / cover fixed no-repeat;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(0, 8, 14, .58);
    }

    .card {
      margin-bottom: 14px;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    h1, h2, #questionNumber, #questionText, #questionScore, .option, #score {
      font-family: var(--display-font);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(42px, 10vw, 64px);
      font-weight: 900;
      letter-spacing: .5px;
      text-shadow: 0 0 12px var(--teal);
    }

    h2 { font-size: clamp(36px, 8vw, 54px); font-weight: 900; }

    .join-screen {
      max-width: 480px;
      margin: 0 auto;
      padding: 18px;
      text-align: center;
      background: rgba(5, 20, 27, .48);
      border: 1px solid rgba(0, 255, 240, .20);
      border-radius: 14px;
      box-shadow: 0 6px 10px rgba(0, 0, 0, .28);
    }

    #qrcode {
      display: inline-block;
      padding: 10px;
      margin: 10px 0;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 12px;
    }

    #qrStatus, .small { color: #b9d5d6; font-size: 14px; }
    #qrStatus { margin-top: 6px; }
    #quiz-container, #results { display: none; }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      max-width: 620px;
      margin: 0 auto 18px;
      color: #d2f7f5;
      font-size: 14px;
      text-shadow: 0 1px 4px #000;
    }

    #questionBox {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      max-width: 620px;
      min-height: 116px;
      margin: 0 auto 18px;
      padding: 18px 22px;
      color: #dffffd;
      background: rgba(0, 30, 36, .72);
      border: 2px solid var(--teal);
      border-radius: 16px;
      box-shadow: 0 0 7px rgba(0,255,240,.8), inset 0 0 18px rgba(0,255,240,.18);
    }

    #questionNumber, #questionScore {
      white-space: nowrap;
      color: var(--teal);
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 900;
      text-shadow: 0 0 7px var(--teal), 0 0 20px var(--teal);
    }

    #questionScore { text-align: right; }

    #questionText {
      min-width: 0;
      color: #dffffd;
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 900;
      line-height: 1.05;
      text-align: center;
      text-shadow: 0 1px 5px #000;
    }

    ul { padding: 0; margin: 0; list-style: none; }

    #options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      max-width: 620px;
      margin: 0 auto;
    }

    .option {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 18px;
      cursor: pointer;
      user-select: none;
      color: var(--teal);
      background: rgba(0, 30, 36, .72);
      border: 2px solid var(--teal);
      border-radius: 16px;
      font-size: clamp(56px, 13vw, 104px);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 0 3px var(--teal), 0 0 10px var(--teal);
      box-shadow: 0 0 7px rgba(0,255,240,.8), inset 0 0 18px rgba(0,255,240,.18);
      transition: transform .12s, background .15s, color .15s, border-color .15s, box-shadow .15s;
    }

    .option:hover { transform: scale(1.03); background: rgba(0, 65, 70, .8); }
    .option.disabled { cursor: default; }

    .option.correct {
      color: #fff;
      background: #0b8f47;
      border-color: #47ff91;
      text-shadow: 0 0 10px #baffd0;
      box-shadow: 0 0 20px #20ff75, inset 0 0 25px rgba(255,255,255,.18);
    }

    .option.incorrect {
      color: #fff;
      background: #a31529;
      border-color: #ff596c;
      text-shadow: 0 0 10px #ffd0d5;
      box-shadow: 0 0 20px #ff203d, inset 0 0 25px rgba(255,255,255,.18);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      padding: 11px 14px;
      cursor: pointer;
      color: #fff;
      border: 0;
      border-radius: 10px;
      font-weight: 600;
    }

    .primary { background: #00a99d; box-shadow: 0 0 12px rgba(0,255,240,.5); }
    .primary:disabled { cursor: not-allowed; background: #426361; box-shadow: none; }
    .secondary { background: rgba(0, 30, 36, .85); border: 1px solid rgba(0,255,240,.5); }

    .field { display: grid; justify-content: center; gap: 6px; margin-top: 10px; }

    input[type="text"] {
      width: min(360px, 90vw);
      padding: 10px;
      color: #fff;
      background: #071c22;
      border: 1px solid #62c9c5;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
    }

    .row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .pill { padding: 3px 8px; color: #003b3b; background: #71fff7; border-radius: 999px; font-size: 12px; }
    .hint { max-width: 680px; margin: 8px auto 0; text-align: center; }

    #leaderboardBox {
      max-width: 620px;
      margin: 18px auto 0;
      padding: 18px;
      background: rgba(5, 20, 27, .62);
      border: 1px solid rgba(0, 255, 240, .22);
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .28);
    }

    #leaderboard { color: #e4ffff; font-size: 14px; line-height: 1.5; }
    .lb-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.15); }
    .lb-row:last-child { border-bottom: 0; }
    #resultFX { min-height: 70px; margin-top: 12px; }
    #results { text-align: center; }
    #score { margin: 8px 0; color: #fff; font-size: 56px; font-weight: 900; }

    @media (max-width: 560px) {
      body { padding: 12px; }
      #options { gap: 10px; }
      .option { padding: 10px; }
      #questionBox { gap: 10px; min-height: 0; padding: 14px 12px; }
      #questionNumber, #questionScore { font-size: 18px; }
      #questionText { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div id="join-screen" class="card join-screen">
    <h1>Animals Quiz</h1>
    <div id="qrcode"></div>
    <div id="qrStatus"></div>

    <form id="joinForm">
      <div class="field">
        <label class="small" for="playerName">Your name</label>
        <input id="playerName" type="text" placeholder="e.g. Pat" autocomplete="nickname" style="text-align:left" />

        <label class="small" for="gameInput">Game code (format 12 34 56)</label>
        <input id="gameInput" type="text" placeholder="12 34 56" inputmode="numeric" />

        <div class="small">Current game: <span id="gameLabel" class="pill">None</span></div>
      </div>

      <div class="small hint">All players in the room must type the same game code to compete.</div>
      <div class="row" style="margin-top:14px;"><button type="submit" class="primary">Start Quiz</button></div>
    </form>
  </div>

  <div id="quiz-container" class="card">
    <div id="quiz">
      <div class="meta">
        <div>Player <span id="whoami" class="pill"></span></div>
        <div>Game <span id="gamePill" class="pill"></span></div>
      </div>

      <div id="questionBox">
        <div id="questionNumber">1/17</div>
        <div id="questionText">Question</div>
        <div id="questionScore">Score <span id="scoreLive">0</span></div>
      </div>

      <ul id="options"></ul>

      <div id="leaderboardBox">
        <div style="font-weight:700; margin-bottom:6px;">Leaderboard</div>
        <div id="leaderboard" class="small">Connecting...</div>
      </div>

      <div class="actions" style="justify-content:flex-end;">
        <button class="secondary" onclick="restart()">Restart</button>
        <button id="nextBtn" class="primary" onclick="nextQuestion()" disabled>Next</button>
      </div>
    </div>

    <div id="results">
      <h2>Finished!</h2>
      <div id="score"></div>
      <div id="resultFX"></div>
      <div class="actions"><button class="primary" onclick="restart()">Play again</button></div>
    </div>
  </div>

  <script>
    const quizData = [
      { q: "What do you call a baby cat?", opts: ["Puppy", "Kitten", "Cub", "Foal"], correct: 1 },
      { q: "Which animal is known as the King of the Jungle?", opts: ["Tiger", "Elephant", "Lion", "Leopard"], correct: 2 },
      { q: "What is the fastest land animal?", opts: ["Lion", "Horse", "Cheetah", "Leopard"], correct: 2 },
      { q: "Which animal has a very long neck?", opts: ["Elephant", "Giraffe", "Camel", "Zebra"], correct: 1 },
      { q: "What animal builds dams in rivers?", opts: ["Otter", "Beaver", "Muskrat", "Platypus"], correct: 1 },
      { q: "Which bird cannot fly?", opts: ["Eagle", "Parrot", "Penguin", "Hawk"], correct: 2 },
      { q: "What is the largest land animal on Earth?", opts: ["Hippopotamus", "White Rhinoceros", "African Elephant", "Giraffe"], correct: 2 },
      { q: "Which marine animal has three hearts?", opts: ["Shark", "Octopus", "Dolphin", "Whale"], correct: 1 },
      { q: "Which reptile can change its skin color?", opts: ["Gecko", "Iguana", "Chameleon", "Komodo Dragon"], correct: 2 },
      { q: "What is the only mammal capable of true flight?", opts: ["Flying Squirrel", "Bat", "Sugar Glider", "Colugo"], correct: 1 },
      { q: "What is a marsupial's defining feature?", opts: ["Scales on body", "Pouch for young", "Webbed feet", "Retractable claws"], correct: 1 },
      { q: "Which animal has the most complex eyes in nature?", opts: ["Eagle", "Mantis Shrimp", "Dragonfly", "Cat"], correct: 1 },
      { q: "What is the venomous mammal that lays eggs?", opts: ["Hedgehog", "Shrew", "Platypus", "Mole"], correct: 2 },
      { q: "Which bird has the longest migration route?", opts: ["Bar-tailed Godwit", "Arctic Tern", "Albatross", "Sooty Shearwater"], correct: 1 },
      { q: "Which insect can lift 50 times its own body weight?", opts: ["Beetle", "Ant", "Grasshopper", "Wasp"], correct: 1 },
      { q: "What animal has fingerprints similar to humans?", opts: ["Chimpanzee", "Gorilla", "Koala", "Orangutan"], correct: 2 },
      { q: "Which animal has the longest lifespan recorded?", opts: ["Greenland Shark", "Ocean Quahog Clam", "Bowhead Whale", "Giant Tortoise"], correct: 0 }
    ];

    const SOCKET_SERVER_URL = "https://quiz-leaderboard-server-1.onrender.com";
    const cuteNames = ["Pink Flamingo", "Tiny Panda", "Happy Koala", "Baby Tiger", "Sunny Bunny", "Mimi Cat", "Blue Dolphin", "Star Penguin", "Lucky Zebra", "Peach Fox", "Moon Kitty", "Jelly Otter"];

    let gameCode = "";
    let idx = 0;
    let score = 0;
    let answered = false;
    let myName = "";
    let latestLeaderboard = [];
    let awaitingFinalResults = false;
    let defaultGameCode = "";
    let defaultPlayerName = "";

    function roomIdFromGameCode(code) { return String(code || "").replace(/\D/g, ""); }

    function makeGameCode() {
      const s = String(Math.floor(Math.random() * 1000000)).padStart(6, "0");
      return s.slice(0, 2) + " " + s.slice(2, 4) + " " + s.slice(4, 6);
    }

    function normalizeGameCode(code) {
      const d = String(code || "").replace(/\D/g, "");
      return d.length === 6 ? d.slice(0, 2) + " " + d.slice(2, 4) + " " + d.slice(4, 6) : "";
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function updateGameUI() {
      document.getElementById("gameLabel").textContent = gameCode || "None";
      document.getElementById("gamePill").textContent = gameCode || "";
      const input = document.getElementById("gameInput");
      if (input && gameCode && input.value === defaultGameCode) input.value = gameCode;
    }

    function renderQR() {
      const holder = document.getElementById("qrcode");
      holder.innerHTML = "";
      if (!window.QRCode) return;
      new QRCode(holder, {
        text: window.location.origin + window.location.pathname,
        width: 220,
        height: 220,
        correctLevel: QRCode.CorrectLevel.M
      });
      document.getElementById("qrStatus").textContent = window.location.origin + window.location.pathname;
    }

    function saveName(name) {
      try { window.name = JSON.stringify({ quizPlayerName: name }); } catch {}
    }

    function getSavedName() {
      try { return JSON.parse(window.name || "{}").quizPlayerName || ""; } catch { return ""; }
    }

    const socket = io(SOCKET_SERVER_URL, { transports: ["websocket", "polling"] });
    socket.on("connect", () => document.getElementById("leaderboard").textContent = "Connected");
    socket.on("connect_error", () => document.getElementById("leaderboard").textContent = "Cannot reach server");
    socket.on("leaderboardUpdate", rows => {
      latestLeaderboard = rows || [];
      renderLeaderboard(latestLeaderboard);
    });

    function renderLeaderboard(rows) {
      const el = document.getElementById("leaderboard");
      if (!el || !rows || !rows.length) {
        el.textContent = "No players yet.";
        return;
      }

      el.innerHTML = rows.map((r, i) =>
        `<div class="lb-row"><div>${i + 1}. ${escapeHtml(r.name)}${r.name === myName ? " (you)" : ""}</div><div><span class="pill">${r.score || 0}</span></div></div>`
      ).join("");
    }

    function startQuiz() {
      myName = (document.getElementById("playerName").value || "").trim();
      saveName(myName);

      if (!gameCode) {
        const enteredCode = normalizeGameCode(document.getElementById("gameInput").value);
        if (!enteredCode) {
          alert("Type game code like 12 34 56");
          return;
        }
        gameCode = enteredCode;
      }

      updateGameUI();
      socket.emit("joinGame", { gameId: roomIdFromGameCode(gameCode), playerName: myName });

      document.getElementById("join-screen").style.display = "none";
      document.getElementById("quiz-container").style.display = "block";
      document.getElementById("whoami").textContent = myName;
      document.getElementById("gamePill").textContent = gameCode;
      document.getElementById("scoreLive").textContent = "0";

      idx = 0;
      score = 0;
      answered = false;
      socket.emit("scoreUpdate", { gameId: roomIdFromGameCode(gameCode), playerName: myName, score, qIndex: idx });
      loadQuestion();
    }

    function loadQuestion() {
      answered = false;
      document.getElementById("questionNumber").textContent = `${idx + 1}/${quizData.length}`;
      document.getElementById("questionText").textContent = quizData[idx].q;

      const options = document.getElementById("options");
      options.innerHTML = "";

      quizData[idx].opts.forEach((text, i) => {
        const tile = document.createElement("li");
        tile.className = "option";
        tile.title = text;
        tile.textContent = String.fromCharCode(65 + i);
        tile.addEventListener("click", () => choose(i, tile));
        options.appendChild(tile);
      });

      document.getElementById("nextBtn").disabled = true;
      document.getElementById("nextBtn").textContent = idx === quizData.length - 1 ? "Finish" : "Next";
      socket.emit("scoreUpdate", { gameId: roomIdFromGameCode(gameCode), playerName: myName, score, qIndex: idx });
    }

    function choose(optIndex, tile) {
      if (answered) return;
      answered = true;

      document.querySelectorAll("#options .option").forEach(item => item.classList.add("disabled"));
      if (optIndex === quizData[idx].correct) {
        tile.classList.add("correct");
        score++;
        document.getElementById("scoreLive").textContent = score;
      } else {
        tile.classList.add("incorrect");
      }

      socket.emit("scoreUpdate", { gameId: roomIdFromGameCode(gameCode), playerName: myName, score, qIndex: idx });
      document.getElementById("nextBtn").disabled = false;
    }

    function nextQuestion() {
      if (!answered) return;
      idx++;
      if (idx >= quizData.length) showResults();
      else loadQuestion();
    }

    function showResults() {
      document.getElementById("quiz").style.display = "none";
      document.getElementById("results").style.display = "block";
      document.getElementById("score").textContent = `${score}/${quizData.length}`;
      socket.emit("scoreUpdate", { gameId: roomIdFromGameCode(gameCode), playerName: myName, score, qIndex: quizData.length });
      awaitingFinalResults = true;
      setTimeout(checkWinners, 500);
    }

    function checkWinners() {
      if (!awaitingFinalResults || !latestLeaderboard.every(r => r.qIndex >= quizData.length)) {
        if (awaitingFinalResults) setTimeout(checkWinners, 500);
        return;
      }

      awaitingFinalResults = false;
      const fx = document.getElementById("resultFX");
      const topScore = latestLeaderboard.reduce((max, player) => Math.max(max, player.score || 0), -Infinity);

      if (score === topScore) {
        confetti({ particleCount: 160, spread: 70, origin: { y: 0.6 } });
      } else {
        fx.innerHTML = '<div style="color:#ff8490;font-weight:800;">Not #1 this time</div>';
      }
    }

    function restart() {
      document.getElementById("quiz-container").style.display = "none";
      document.getElementById("join-screen").style.display = "block";
      document.getElementById("quiz").style.display = "block";
      document.getElementById("results").style.display = "none";
      idx = 0;
      score = 0;
      answered = false;
      myName = "";
      gameCode = "";
      document.getElementById("playerName").value = defaultPlayerName;
      document.getElementById("gameInput").value = defaultGameCode;
      updateGameUI();
      renderQR();
    }

    document.getElementById("playerName").addEventListener("focus", e => {
      if (e.target.value === defaultPlayerName) e.target.value = "";
    });

    document.getElementById("gameInput").addEventListener("focus", e => {
      if (e.target.value === defaultGameCode) e.target.value = "";
    });

    document.addEventListener("input", e => {
      if (e.target?.id !== "gameInput") return;
      const digits = String(e.target.value || "").replace(/\D/g, "").slice(0, 6);
      e.target.value = digits.length <= 2 ? digits : digits.length <= 4 ? digits.slice(0, 2) + " " + digits.slice(2) : digits.slice(0, 2) + " " + digits.slice(2, 4) + " " + digits.slice(4, 6);
    });

    document.getElementById("joinForm").addEventListener("submit", e => {
      e.preventDefault();
      setTimeout(startQuiz, 0);
    });

    window.addEventListener("load", () => {
      renderQR();
      defaultGameCode = makeGameCode();
      gameCode = defaultGameCode;
      document.getElementById("gameInput").value = defaultGameCode;
      updateGameUI();
      defaultPlayerName = getSavedName() || cuteNames[Math.floor(Math.random() * cuteNames.length)];
      document.getElementById("playerName").value = defaultPlayerName;
    });
  </script>
</body>
</html>
