<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animals Quiz</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 820px; margin: 0 auto; padding: 18px; background: #f6f7fb; }
    .card { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 6px 20px rgba(0,0,0,.08); margin-bottom: 14px; }
    h1 { margin: 0 0 8px; }
    .join-screen { text-align: center; }
    #qrcode { display: inline-block; padding: 10px; background: #fff; border-radius: 12px; border: 1px solid #eee; margin: 10px 0; }
    #qrStatus { color: #666; font-size: 14px; margin-top: 6px; }
    .small { color: #666; font-size: 14px; }
    #quiz-container { display: none; }
    .meta { display:flex; justify-content:space-between; color:#666; font-size:14px; margin-bottom:8px; gap:10px; flex-wrap:wrap; }
    ul { list-style: none; padding: 0; margin: 0; }
    .option { padding: 12px 12px; border: 1px solid #e5e7eb; border-radius: 10px; margin: 10px 0; cursor: pointer; background: #fafafa; user-select: none; }
    .option:hover { background: #f1f5ff; }
    .option.disabled { cursor: default; opacity: .9; }
    .option.correct { background: #e8f7ee; border-color: #2ecc71; }
    .option.incorrect { background: #fdecec; border-color: #e74c3c; }
    .actions { margin-top: 14px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button { border: 0; border-radius: 10px; padding: 11px 14px; cursor: pointer; font-weight: 600; }
    .primary { background: #4f46e5; color: #fff; }
    .primary:disabled { background: #b8b5ff; cursor: not-allowed; }
    .field { margin-top: 10px; display: grid; gap: 6px; justify-content: center; }
    input[type="text"] { padding: 10px; border-radius: 10px; border: 1px solid #e5e7eb; width: min(360px, 90vw); font-size: 16px; text-align: center; }
    .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .pill { font-size: 12px; color:#3730a3; background:#eef2ff; padding: 3px 8px; border-radius: 999px; }
    #leaderboardBox { margin-top: 12px; }
    #leaderboard { font-size: 14px; color: #111827; line-height: 1.5; }
    .lb-row { display:flex; justify-content:space-between; gap:12px; padding: 6px 0; border-bottom: 1px solid #f1f1f1; }
    .lb-row:last-child { border-bottom: 0; }
    .hint { max-width: 680px; margin: 8px auto 0; text-align: center; }
    #resultFX { margin-top: 12px; min-height: 70px; }
    #results { display: none; text-align: center; }
    #score { font-size: 40px; font-weight: 800; margin: 8px 0; color: #111827; }
  </style>
</head>
<body>
  <div id="join-screen" class="card join-screen">
    <h1>Animals Quiz</h1>
    <div id="qrcode"></div>
    <div id="qrStatus"></div>

    <div class="field">
      <label class="small" for="playerName">Your name</label>
      <input id="playerName" type="text" placeholder="e.g. Pat" autocomplete="nickname" style="text-align:left" />

      <label class="small" for="gameInput">Game code (format 12 34 56)</label>
      <input id="gameInput" type="text" placeholder="12 34 56" inputmode="numeric" />

      <div class="small">Current game: <span id="gameLabel" class="pill">None</span></div>
    </div>

    <div class="small hint">All players in the room must type the same game code to compete.</div>
    <div class="row" style="margin-top:14px;">
      <button class="primary" onclick="startQuiz()">Start Quiz</button>
    </div>
  </div>

  <div id="quiz-container" class="card">
    <div id="quiz">
      <div class="meta">
        <div>Q <span id="qnum">1</span>/<span id="qtotal">25</span></div>
        <div>Score <span id="scoreLive">0</span></div>
        <div>Player <span id="whoami" class="pill"></span></div>
        <div>Game <span id="gamePill" class="pill"></span></div>
      </div>

      <ul id="options"></ul>
      <div id="leaderboardBox" class="card">
        <div style="font-weight:700; margin-bottom:6px;">Leaderboard</div>
        <div id="leaderboard" class="small">Connecting...</div>
      </div>
      <div class="actions" style="justify-content:flex-end;">
        <button class="secondary" onclick="restart()">Restart</button>
        <button id="nextBtn" class="primary" onclick="nextQuestion()" disabled>Next</button>
      </div>
    </div>

    <div id="results">
      <h2>Finished!</h2>
      <div id="score"></div>
      <div id="resultFX"></div>
      <div class="actions" style="justify-content:center;">
        <button class="primary" onclick="restart()">Play again</button>
      </div>
    </div>
  </div>

  <script>
    const quizData = [
      { q: "What do you call a baby cat?", opts: ["Puppy", "Kitten", "Cub", "Foal"], correct: 1 },
      { q: "Which animal is known as the King of the Jungle?", opts: ["Tiger", "Elephant", "Lion", "Leopard"], correct: 2 },
      { q: "What is the fastest land animal?", opts: ["Lion", "Horse", "Cheetah", "Leopard"], correct: 2 },
      { q: "Which animal has a very long neck?", opts: ["Elephant", "Giraffe", "Camel", "Zebra"], correct: 1 },
      { q: "Which animal is known for its black and white stripes?", opts: ["Cheetah", "Hyena", "Zebra", "Panda"], correct: 2 },
      { q: "What animal builds dams in rivers?", opts: ["Otter", "Beaver", "Muskrat", "Platypus"], correct: 1 },
      { q: "Which bird cannot fly?", opts: ["Eagle", "Parrot", "Penguin", "Hawk"], correct: 2 },
      { q: "What is the largest land animal on Earth?", opts: ["Hippopotamus", "White Rhinoceros", "African Elephant", "Giraffe"], correct: 2 },
      { q: "Which marine animal has three hearts?", opts: ["Shark", "Octopus", "Dolphin", "Whale"], correct: 1 },
      { q: "What do you call a group of wolves?", opts: ["Pack", "Herd", "Pride", "Colony"], correct: 0 },
      { q: "Which reptile can change its skin color?", opts: ["Gecko", "Iguana", "Chameleon", "Komodo Dragon"], correct: 2 },
      { q: "What is the only mammal capable of true flight?", opts: ["Flying Squirrel", "Bat", "Sugar Glider", "Colugo"], correct: 1 },
      { q: "Which animal produces silk?", opts: ["Spider", "Silkworm", "Bee", "Ant"], correct: 1 },
      { q: "What is a marsupial's defining feature?", opts: ["Scales on body", "Pouch for young", "Webbed feet", "Retractable claws"], correct: 1 },
      { q: "Which animal has the most complex eyes in nature?", opts: ["Eagle", "Mantis Shrimp", "Dragonfly", "Cat"], correct: 1 },
      { q: "What is the venomous mammal that lays eggs?", opts: ["Hedgehog", "Shrew", "Platypus", "Mole"], correct: 2 },
      { q: "Which bird has the longest migration route?", opts: ["Bar-tailed Godwit", "Arctic Tern", "Albatross", "Sooty Shearwater"], correct: 1 },
      { q: "What is the largest species of shark?", opts: ["Great White Shark", "Tiger Shark", "Whale Shark", "Bull Shark"], correct: 2 },
      { q: "Which insect can lift 50 times its own body weight?", opts: ["Beetle", "Ant", "Grasshopper", "Wasp"], correct: 1 },
      { q: "What animal has fingerprints similar to humans?", opts: ["Chimpanzee", "Gorilla", "Koala", "Orangutan"], correct: 2 },
      { q: "Which fish can survive out of water for months?", opts: ["Mudskipper", "Lungfish", "Snakehead Fish", "Walking Catfish"], correct: 1 },
      { q: "What is the mimic octopus known for?", opts: ["Glowing in the dark", "Impersonating other species", "Walking on land", "Producing venom"], correct: 1 },
      { q: "Which animal has the longest lifespan recorded?", opts: ["Greenland Shark", "Ocean Quahog Clam", "Bowhead Whale", "Giant Tortoise"], correct: 0 },
      { q: "What is unique about a tardigrade under extreme stress?", opts: ["It becomes transparent", "It enters cryptobiosis", "It sheds its exoskeleton", "It multiplies by fission"], correct: 1 },
      { q: "Which cephalopod has the largest eyes in the animal kingdom?", opts: ["Giant Octopus", "Nautilus", "Giant Squid", "Colossal Squid"], correct: 3 }
    ];

    const SOCKET_SERVER_URL = "https://quiz-leaderboard-server-1.onrender.com";
    const cuteNames = ["Pink Flamingo", "Tiny Panda", "Happy Koala", "Baby Tiger", "Sunny Bunny", "Mimi Cat", "Blue Dolphin", "Star Penguin", "Lucky Zebra", "Peach Fox", "Moon Kitty", "Jelly Otter"];

    let gameCode = "", idx = 0, score = 0, answered = false, myName = "", latestLeaderboard = [], awaitingFinalResults = false, defaultGameCode = "", defaultPlayerName = "";

    function roomIdFromGameCode(code) { return String(code || "").replace(/\D/g, ""); }
    function makeGameCode() { const s = String(Math.floor(Math.random() * 1000000)).padStart(6, "0"); return s.slice(0,2) + " " + s.slice(2,4) + " " + s.slice(4,6); }
    function normalizeGameCode(code) { const d = String(code || "").replace(/\D/g, ""); return d.length === 6 ? d.slice(0,2) + " " + d.slice(2,4) + " " + d.slice(4,6) : ""; }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;',"\'":"&#39;" }[c])); }

    function updateGameUI() {
      document.getElementById("gameLabel").textContent = gameCode || "None";
      document.getElementById("gamePill").textContent = gameCode || "";
      const gi = document.getElementById("gameInput");
      if (gi && gameCode && gi.value === defaultGameCode) gi.value = gameCode;
    }

    function renderQR() {
      const holder = document.getElementById("qrcode");
      holder.innerHTML = "";
      if (!window.QRCode) return;
      new QRCode(holder, { text: window.location.origin + window.location.pathname, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
      document.getElementById("qrStatus").textContent = window.location.origin + window.location.pathname;
    }

    function saveName(name) { try { window.name = JSON.stringify({ quizPlayerName: name }); } catch {} }
    function getSavedName() { try { return JSON.parse(window.name || "{}").quizPlayerName || ""; } catch { return ""; } }

    const socket = io(SOCKET_SERVER_URL, { transports: ["websocket", "polling"] });
    socket.on("connect", () => document.getElementById("leaderboard").textContent = "Connected");
    socket.on("connect_error", () => document.getElementById("leaderboard").textContent = "Cannot reach server");
    socket.on("leaderboardUpdate", rows => { latestLeaderboard = rows || []; renderLeaderboard(rows); });

    function renderLeaderboard(rows) {
      const el = document.getElementById("leaderboard");
      if (!el || !rows || !rows.length) { el.textContent = "No players yet."; return; }
      el.innerHTML = rows.map((r, i) => `<div class="lb-row"><div>${i+1}. ${escapeHtml(r.name)}${r.name===myName?" (you)":""}</div><div><span class="pill">${r.score||0}</span></div></div>`).join("");
    }

    function startQuiz() {
      const input = document.getElementById("playerName");
      myName = (input?.value || "").trim();
      saveName(myName);

      if (!gameCode) { const t = normalizeGameCode(document.getElementById("gameInput").value); if (!t) { alert("Type game code like 12 34 56"); return; } gameCode = t; }
      updateGameUI();

      socket.emit("joinGame", { gameId: roomIdFromGameCode(gameCode), playerName: myName });
      document.getElementById("join-screen").style.display = "none";
      document.getElementById("quiz-container").style.display = "block";
      document.getElementById("qtotal").textContent = quizData.length;
      document.getElementById("whoami").textContent = myName;
      document.getElementById("gamePill").textContent = gameCode;
      document.getElementById("scoreLive").textContent = "0";

      idx = 0; score = 0; answered = false;
      socket.emit("scoreUpdate", { gameId: roomIdFromGameCode(gameCode), playerName: myName, score, qIndex: idx });
      loadQuestion();
    }

    function loadQuestion() {
      answered = false;
      document.getElementById("qnum").textContent = idx + 1;
      const ul = document.getElementById("options");
      ul.innerHTML = "";
      quizData[idx].opts.forEach((text, i) => {
        const li = document.createElement("li");
        li.className = "option";
        li.textContent = String.fromCharCode(65 + i);
        li.addEventListener("click", () => choose(i, li));
        ul.appendChild(li);
      });
      document.getElementById("nextBtn").disabled = true;
      document.getElementById("nextBtn").textContent = idx === quizData.length - 1 ? "Finish" : "Next";
      socket.emit("scoreUpdate", { gameId: roomIdFromGameCode(gameCode), playerName: myName, score, qIndex: idx });
    }

    function choose(optIndex, element) {
      if (answered) return;
      answered = true;
      const q = quizData[idx];
      document.querySelectorAll("#options .option").forEach(li => li.classList.add("disabled"));

      if (optIndex === q.correct) { element.classList.add("correct"); score++; document.getElementById("scoreLive").textContent = score; }
      else element.classList.add("incorrect");

      socket.emit("scoreUpdate", { gameId: roomIdFromGameCode(gameCode), playerName: myName, score, qIndex: idx });
      document.getElementById("nextBtn").disabled = false;
    }

    function nextQuestion() {
      if (!answered) return;
      idx++;
      if (idx >= quizData.length) showResults(); else loadQuestion();
    }

    function showResults() {
      document.getElementById("quiz").style.display = "none";
      document.getElementById("results").style.display = "block";
      document.getElementById("score").textContent = `${score}/${quizData.length}`;
      socket.emit("scoreUpdate", { gameId: roomIdFromGameCode(gameCode), playerName: myName, score, qIndex: quizData.length });
      awaitingFinalResults = true;
      setTimeout(checkWinners, 500);
    }

    function checkWinners() {
      if (!awaitingFinalResults || !latestLeaderboard.every(r => r.qIndex >= quizData.length)) {
        if (awaitingFinalResults) setTimeout(checkWinners, 500);
        return;
      }
      awaitingFinalResults = false;
      const fx = document.getElementById("resultFX");
      const topScore = latestLeaderboard.reduce((m, r) => Math.max(m, r.score || 0), -Infinity);
      if (score === topScore) confetti({ particleCount: 160, spread: 70, origin: { y: 0.6 } });
      else fx.innerHTML = `<div style="color:#b91c1c;font-weight:800;">Not #1 this time</div>`;
    }

    function restart() {
      document.getElementById("quiz-container").style.display = "none";
      document.getElementById("join-screen").style.display = "block";
      idx = 0; score = 0; answered = false; myName = "";
      gameCode = "";
      document.getElementById("playerName").value = defaultPlayerName;
      document.getElementById("gameInput").value = defaultGameCode;
      updateGameUI();
      renderQR();
    }

    // Clear default value on focus (click/tap)
    document.getElementById("playerName").addEventListener("focus", e => {
      if (e.target.value === defaultPlayerName) e.target.value = "";
    });

    document.getElementById("gameInput").addEventListener("focus", e => {
      if (e.target.value === defaultGameCode) e.target.value = "";
    });

    document.addEventListener("input", e => {
      if (e.target && e.target.id === "gameInput") {
        const d = String(e.target.value || "").replace(/\D/g, "").slice(0, 6);
        e.target.value = d.length <= 2 ? d : d.length <= 4 ? d.slice(0,2) + " " + d.slice(2) : d.slice(0,2) + " " + d.slice(2,4) + " " + d.slice(4,6);
      }
    });

    window.addEventListener("load", () => {
      renderQR();
      defaultGameCode = makeGameCode();
      gameCode = defaultGameCode;
      document.getElementById("gameInput").value = defaultGameCode;
      updateGameUI();
      
      const saved = getSavedName();
      defaultPlayerName = saved || cuteNames[Math.floor(Math.random() * cuteNames.length)];
      document.getElementById("playerName").value = defaultPlayerName;
    });
  </script>
</body>
</html>
